# Render Blueprint: New > Blueprint, point it at this repo.
#
# One free web service runs nginx (frontend + /api proxy) and the API together, built from
# Dockerfile.render. That avoids Render's paid private services, and the browser only ever
# talks to one origin, which is what the refresh-token cookie needs.
databases:
  - name: mushare-db
    plan: free
    databaseName: mushare
    user: mushare

services:
  - type: web
    name: mushare
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mushare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_CATALOG
        value: "true"
      - key: PORT
        value: "8080"
      # Render's free-tier disks are ephemeral, so uploads go to an S3-compatible bucket
      # (Cloudflare R2, Backblaze B2, AWS...). Fill the secrets in the dashboard. Without them
      # My Studio uploads are lost on every deploy.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
