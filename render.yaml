# Render Blueprint: New > Blueprint, point it at this repo.
databases:
  - name: mushare-db
    plan: free
    databaseName: mushare
    user: mushare

services:
  # Private API: only reachable from the web service, never from the internet.
  - type: pserv
    name: mushare-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mushare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_CATALOG
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: PORT
        value: "8000"
      # Render's free-tier disks are ephemeral, so uploads go to an S3-compatible bucket
      # (R2, Backblaze B2, AWS...). Fill these in the dashboard. Without them My Studio uploads
      # are lost on every deploy.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # Public site: serves the frontend and proxies /api to the private API, so the browser
  # only ever talks to one origin (which is what the refresh-token cookie needs).
  - type: web
    name: mushare-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile.prod
    dockerContext: ./frontend
    healthCheckPath: /healthz
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: mushare-api
          property: hostport
      - key: PORT
        value: "8080"
